<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售考核自动化系统 - 北京北方努派服装公司</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <h1>销售考核自动化系统</h1>
            <p class="subtitle">北京北方努派服装公司</p>
        </header>

        <!-- 导航标签 -->
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="import">数据导入</button>
            <button class="tab-btn" data-tab="ranking">排行榜</button>
            <button class="tab-btn" data-tab="detail">个人详情</button>
        </nav>

        <!-- 数据导入页面 -->
        <section id="import" class="tab-content active">
            <div class="card">
                <h2>上传Excel文件</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p>点击或拖拽文件到此处</p>
                    <p class="hint">支持 .xlsx, .xls 格式</p>
                    <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
                </div>
                <div id="uploadStatus" class="upload-status"></div>
            </div>

            <div class="card">
                <h2>Excel格式说明</h2>
                <div class="format-info">
                    <table class="format-table">
                        <thead>
                            <tr>
                                <th>列号</th>
                                <th>内容</th>
                                <th>示例</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>A</td><td>销售员姓名</td><td>张三</td></tr>
                            <tr><td>B</td><td>项目名称</td><td>XX公司采购项目</td></tr>
                            <tr><td>C</td><td>当前阶段</td><td>深入</td></tr>
                            <tr><td>D</td><td>项目金额（万元）</td><td>500</td></tr>
                            <tr><td>E</td><td>进入当前阶段日期</td><td>2024-11-25</td></tr>
                            <tr><td>F</td><td>本月初阶段</td><td>接触</td></tr>
                            <tr><td>G</td><td>本月末阶段</td><td>深入</td></tr>
                            <tr><td>H-W</td><td>任务1.1-7.1完成度</td><td>100%/50%/0%</td></tr>
                            <tr><td>X</td><td>进攻计划得分</td><td>28</td></tr>
                        </tbody>
                    </table>
                </div>
                <button class="btn btn-secondary" onclick="downloadTemplate()">下载模板</button>
                <button class="btn btn-secondary" onclick="loadTestData()">加载测试数据</button>
            </div>
        </section>

        <!-- 排行榜页面 -->
        <section id="ranking" class="tab-content">
            <div class="card">
                <div class="ranking-header">
                    <h2>月度销售排行榜</h2>
                    <button class="btn btn-primary" onclick="exportToExcel()">导出Excel</button>
                </div>
                <div id="rankingContent">
                    <p class="empty-hint">请先导入数据</p>
                </div>
            </div>
        </section>

        <!-- 个人详情页 -->
        <section id="detail" class="tab-content">
            <div class="card">
                <h2>个人考核详情</h2>
                <div class="person-selector">
                    <label>选择销售员：</label>
                    <select id="personSelect" onchange="showPersonDetail()">
                        <option value="">-- 请选择 --</option>
                    </select>
                </div>
                <div id="detailContent">
                    <p class="empty-hint">请先导入数据并选择销售员</p>
                </div>
            </div>
        </section>
    </div>

    <script src="config.js"></script>
    <script src="calculator.js"></script>
    <script src="app.js"></script>
</body>
</html>
